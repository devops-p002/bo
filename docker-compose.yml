name: bo

# Deliberately no `env_file:` anywhere in this file. Secrets live outside
# the repo checkout entirely (see .github/workflows/deploy.yml's own
# comment) and are supplied at `docker compose` invocation time via
# `--env-file`, which populates the ${...} interpolation below - including
# straight into postgres's own `environment:` block, since
# infra/postgres/init-databases.sh reads SERVICE_DB_PASSWORD_BACKOFFICE_API
# from that container's real environment, not from a mounted file.

networks:
  bo-internal:
    driver: bridge

volumes:
  postgres-data:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bo_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      POSTGRES_DB: postgres
      SERVICE_DB_PASSWORD_BACKOFFICE_API: ${SERVICE_DB_PASSWORD_BACKOFFICE_API:?SERVICE_DB_PASSWORD_BACKOFFICE_API is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    networks:
      - bo-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bo_admin"]
      interval: 5s
      timeout: 5s
      retries: 10

  backoffice-api:
    build:
      context: .
      dockerfile: services/backoffice-api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://backoffice_api_app:${SERVICE_DB_PASSWORD_BACKOFFICE_API:?SERVICE_DB_PASSWORD_BACKOFFICE_API is required}@postgres:5432/backoffice_api
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?ADMIN_JWT_SECRET is required}
    # 127.0.0.1-only: cloudflared (running directly on the VM host, not in
    # Docker) reaches this over loopback - never exposed to the internet
    # except through the tunnel's own ingress rule.
    ports:
      - "127.0.0.1:6000:5000"
    networks:
      - bo-internal

  backoffice-web:
    build:
      context: .
      dockerfile: apps/backoffice-web/Dockerfile
      args:
        REACT_APP_API_URL: ${BACKOFFICE_WEB_API_URL:-https://api-back-office.admin.betqueen.live}
        REACT_APP_GRAPHQL_HTTP_URL: ${BACKOFFICE_WEB_API_URL:-https://api-back-office.admin.betqueen.live}/graphql
        REACT_APP_GRAPHQL_WS_URL: ${BACKOFFICE_WEB_WS_URL:-wss://api-back-office.admin.betqueen.live/graphql}
    restart: unless-stopped
    ports:
      - "127.0.0.1:6100:80"
    networks:
      - bo-internal

  # player_api_app's role/password is provisioned by the player-api-
  # grants migration (run as part of backoffice-api's own migrate:up),
  # not by postgres's own init script - see that migration's comment.
  player-api:
    build:
      context: .
      dockerfile: services/player-api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5200
      NODE_ENV: production
      DATABASE_URL: postgresql://player_api_app:${SERVICE_DB_PASSWORD_PLAYER_API:?SERVICE_DB_PASSWORD_PLAYER_API is required}@postgres:5432/backoffice_api
      PLAYER_JWT_SECRET: ${PLAYER_JWT_SECRET:?PLAYER_JWT_SECRET is required}
      CORS_ORIGIN: ${PLAYER_WEB_ORIGIN:-https://betqueen.live}
    # 127.0.0.1-only - same cloudflared-over-loopback reasoning as
    # backoffice-api.
    ports:
      - "127.0.0.1:6200:5200"
    networks:
      - bo-internal

  player-web:
    build:
      context: .
      dockerfile: apps/player-web/Dockerfile
      args:
        REACT_APP_API_URL: ${PLAYER_WEB_API_URL:-https://api.betqueen.live}
    restart: unless-stopped
    ports:
      - "127.0.0.1:6300:80"
    networks:
      - bo-internal
