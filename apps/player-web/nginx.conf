server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Vite SPA - unknown paths fall back to index.html so React Router
    # handles client-side routes instead of nginx 404ing them.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /assets/ chunk filenames are content-hashed, so a 30d immutable cache
    # is safe there - but index.html must never be cached at all: without
    # this, a browser holding a stale cached index.html after a redeploy
    # keeps referencing old chunk hashes the new build no longer has,
    # which 404s on dynamic import and crashes the SPA router.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
