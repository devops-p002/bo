name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Only one deploy at a time against the VM - a second push landing mid-
# deploy should wait its turn, not race the first one's `docker compose up`.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  # Fast, infra-free gate: lint + typecheck every package (turbo, so only
  # what actually changed plus its dependents re-runs). Deliberately NOT
  # `pnpm test` here - backoffice-api's own integration suite boots real
  # ledger and account servers as dependencies (see its test/setup.ts),
  # and neither service exists in this repo yet. Revisit once that's
  # decided one way or the other.
  verify:
    name: lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  deploy:
    needs: verify
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # actions/checkout's default `clean: true` runs `git clean -ffdx`
      # before every checkout, which would delete any untracked file left
      # inside the runner's own working directory - including a secrets
      # file, if one were kept there. So it isn't: real values
      # (POSTGRES_ADMIN_PASSWORD, SERVICE_DB_PASSWORD_BACKOFFICE_API,
      # ADMIN_JWT_SECRET, ...) live in ~/bo-secrets/.env, outside any repo
      # checkout, created once by hand on the VM and never touched by CI.
      - name: build images
        run: docker compose --env-file "$HOME/bo-secrets/.env" -p bo build

      - name: start postgres and wait for it to become healthy
        run: |
          set -euo pipefail
          docker compose --env-file "$HOME/bo-secrets/.env" -p bo up -d postgres
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' bo-postgres-1 2>/dev/null || echo starting)
            if [ "$status" = "healthy" ]; then
              echo "postgres healthy"
              exit 0
            fi
            sleep 2
          done
          echo "postgres did not become healthy in time (status: $status)" >&2
          docker compose -p bo logs postgres
          exit 1

      # Migrations run as the Postgres superuser, not backoffice_api_app -
      # backoffice_api_app only has schema USAGE (see infra/postgres/
      # init-databases.sh), never CREATE, and Postgres 15+ no longer grants
      # PUBLIC that by default either. The tables migrations create are
      # meant to be owned by the superuser; the final migration
      # (grants.cjs) is what explicitly GRANTs backoffice_api_app scoped,
      # table-level privileges on top - same division of responsibility
      # platform/infra/deploy.sh already uses (migrates as platform_admin,
      # runs the app as its own least-privilege role).
      - name: run backoffice-api migrations
        run: |
          set -euo pipefail
          set -a
          source "$HOME/bo-secrets/.env"
          set +a
          docker compose --env-file "$HOME/bo-secrets/.env" -p bo run --rm \
            -e DATABASE_URL="postgresql://bo_admin:${POSTGRES_ADMIN_PASSWORD}@postgres:5432/backoffice_api" \
            backoffice-api pnpm migrate:up

      - name: deploy
        run: docker compose --env-file "$HOME/bo-secrets/.env" -p bo up -d --remove-orphans

      - name: prune old images
        run: docker image prune -f
